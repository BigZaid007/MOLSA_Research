{% extends "base.html" %}
{% block title %}{{ t('error.title') }} — {{ t('appName') }}{% endblock %}
{% block content %}
<div class="flex min-h-[60vh] items-center justify-center">
    <div class="card max-w-md p-8 text-center">
        <h1 class="text-2xl font-semibold">{{ t('error.title') }}</h1>
        <p class="mt-2 text-sm text-slate-500">{{ t('error.message') }}</p>
        <div class="mt-6 flex flex-wrap justify-center gap-3">
            <a href="/" class="btn-primary rounded-xl px-5 py-2 text-sm">{{ t('error.home') }}</a>
            <button type="button" onclick="history.back()" class="btn-ghost rounded-xl px-5 py-2 text-sm">{{ t('error.back') }}</button>
        </div>
    </div>
</div>
{% endblock %}
